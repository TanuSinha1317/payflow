spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/payflow}
    username: ${DB_USERNAME:payflow}
    password: ${DB_PASSWORD:payflow_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
  task.scheduling.enabled: ${RECONCILIATION_SCHEDULED:false}
server:
  error:
    include-message: never
management.endpoints.web.exposure.include: health,info
springdoc.swagger-ui.path: /swagger-ui.html
payflow:
  jwt-secret: ${JWT_SECRET:local-development-secret-change-me-now}
  jwt-expiry-minutes: ${JWT_EXPIRY_MINUTES:60}
  cors-origins: ${CORS_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:3000,http://127.0.0.1:3000}
  topup-max-paise: ${TOPUP_MAX_PAISE:5000000}
  transfer-max-paise: ${TRANSFER_MAX_PAISE:2500000}
  demo-enabled: ${DEMO_ENABLED:false}
  lab-enabled: ${LAB_ENABLED:false}
  admin:
    email: ${ADMIN_EMAIL:}
    phone: ${ADMIN_PHONE:}
    password: ${ADMIN_PASSWORD:}

